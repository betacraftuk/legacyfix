plugins {
    id 'java'
}

group 'uk.betacraft'
version '2.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    compileOnly("net.fabricmc:fabric-loader:0.15.3")
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}