plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '6.1.0'
}

group 'uk.betacraft'

// Release versions should use yy.month or yy.month.patch
def releaseVersion = findProperty('releaseVersion') ?: System.getenv('RELEASE_VERSION')

if (releaseVersion) {
    version releaseVersion
} else if (System.getenv('CI_NIGHTLY') == 'true') {
    def runId = System.getenv('GITHUB_RUN_ID')
    if (!runId) {
        throw new GradleException('CI_NIGHTLY=true requires GITHUB_RUN_ID to be set')
    }

    version "nightly-${runId}"
} else {
    version "dev-${new Date().format('yyyyMMdd')}"
}

subprojects {
    apply plugin: 'java'

    processResources {
        def versionString = "${rootProject.version}"
        inputs.property 'version', versionString

        def tokens = [version: versionString]
        filesMatching('*mod*') { expand tokens }
        filesMatching('version.txt') { expand tokens }
    }
}

dependencies {
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project(':common').configurations.runtimeClasspath]
    from project(':common').jar
    from project(':fabric').jar
    from project(':fml').jar
    from project(':risugami').jar

    manifest {
        attributes(
            'TweakClass': 'uk.betacraft.legacyfix.tweaker.LFTweaker',
            'Main-Class': 'uk.betacraft.legacyfix.LegacyFixLauncher',
            'Premain-Class': 'uk.betacraft.legacyfix.Agent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'FMLCorePlugin': 'uk.betacraft.legacyfix.fml.CpwCoreMod'
        )
    }
}

assemble {
    dependsOn(shadowJar)
}

jar {
    enabled = false
}
