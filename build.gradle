plugins {
    id 'java'
}

group 'uk.betacraft'
version '2.0'

targetCompatibility = 5
sourceCompatibility = 5

repositories {
    mavenCentral()
}

configurations {
    library
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    library files('libs/javassist-java5.jar')
    library files('libs/jna-5.17.0.jar')
    library files('libs/json-v20240303-SNAPSHOT.jar')
}

processResources {
    filesMatching("release_info.json") {
        expand version: "${project.version}-${new Date().format('yyyyMMdd')}"
    }
}

jar {
    from {
        configurations.library.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    manifest {
        attributes(
                'Main-Class': 'uk.betacraft.legacyfix.LegacyFixLauncher',
                'Premain-Class': 'uk.betacraft.legacyfix.LegacyFixAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}