name: Nightly Build

on:
  push:
    branches: [ v3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: 8
        distribution: 'zulu'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build
      env:
        CI_NIGHTLY: 'true'
      run: ./gradlew build
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: legacyfix-nightly-${{ github.run_id }}
        path: build/libs
