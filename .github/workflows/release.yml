name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9]*'
      - '[0-9][0-9].[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: 8
        distribution: 'zulu'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build
      run: ./gradlew build -PreleaseVersion=${{ github.ref_name }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: legacyfix-${{ github.ref_name }}
        path: build/libs
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        files: build/libs/*
